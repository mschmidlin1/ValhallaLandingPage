<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Schmid-Lab</title>
  <link rel="icon" id="favicon" href="favicon-dark.svg" type="image/svg+xml" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("valhalla-theme");
        var theme = t === "light" || t === "dark"
          ? t
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var link = document.getElementById("favicon");
        if (link) link.href = theme === "light" ? "favicon-light.svg" : "favicon-dark.svg";
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/theme.css?v=40" />
  <link rel="stylesheet" href="css/styles.css?v=44" />
</head>
<body>
  <!-- Shared SVG gradient for metallic icons and accents -->
  <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" class="svg-defs">
    <defs>
      <linearGradient id="valhalla-metal" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" class="metal-s1"/>
        <stop offset="8%" class="metal-s2"/>
        <stop offset="22%" class="metal-s3"/>
        <stop offset="38%" class="metal-s4"/>
        <stop offset="52%" class="metal-s5"/>
        <stop offset="68%" class="metal-s6"/>
        <stop offset="82%" class="metal-s7"/>
        <stop offset="100%" class="metal-s8"/>
      </linearGradient>
      <!-- Flat-top hex with a small circular fillet at each vertex. Coordinates are 0–1 of the tile box. -->
      <clipPath id="hex-round" clipPathUnits="objectBoundingBox">
        <path d="M 0.23268 0.03464 A 0.06 0.06928 0 0 1 0.28464 0 L 0.71536 0 A 0.06 0.06928 0 0 1 0.76732 0.03464 L 0.98268 0.46536 A 0.06 0.06928 0 0 1 0.98268 0.53464 L 0.76732 0.96536 A 0.06 0.06928 0 0 1 0.71536 1 L 0.28464 1 A 0.06 0.06928 0 0 1 0.23268 0.96536 L 0.01732 0.53464 A 0.06 0.06928 0 0 1 0.01732 0.46536 Z"/>
      </clipPath>
    </defs>
  </svg>

  <header class="site-header">
    <h1 class="site-title">Schmid-Lab</h1>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle color theme"></button>
  </header>

  <main class="page-main">
    <div class="link-grid" id="link-grid"></div>
  </main>

  <div id="coming-soon-banner" class="coming-soon-banner" role="status" aria-live="polite" hidden>
    <span class="coming-soon-banner__message">This app is on the way. Check back soon!</span>
  </div>

  <script type="module" src="js/theme.js?v=38"></script>
  <script type="module" src="js/app.js?v=45"></script>
</body>
</html>
